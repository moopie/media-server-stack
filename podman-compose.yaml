version: '3'

services:
  plex:
    image: plexinc/pms-docker:latest
    environment:
      - PUID=1000
      - PGID=985
      - TZ=Asia/Jerusalem
    ports:
      - 32400:32400
    volumes:
      - ./data/plex:/config
      - ./media:/data
    networks:
      - media

  torrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=985
      - TZ=Asia/Jerusalem
      - WEBUI_PORT=9091
    volumes:
      - ./data/qbittorrent:/config
      - ./downloads:/downloads
    ports:
      - 9091:9091
      - 6881:6881
      - 6881:6881/udp
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=985
      - TZ=Asia/Jerusalem
    ports:
      - 8989:8989
    volumes:
      - ./data/sonarr:/config
      - ./downloads:/downloads
      - ./media/tv:/tv
    networks:
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=985
      - TZ=Asia/Jerusalem
    ports:
      - 7878:7878
    volumes:
      - ./data/radarr:/config
      - ./downloads:/downloads
      - ./media/movies:/movies
    networks:
      - media

  overseerr:
    image: ghcr.io/seerr-team/seerr:latest
    environment:
      - TZ=Asia/Jerusalem
      - PORT=5055
    volumes:
      - ./data/seerr:/app/config
    ports:
      - 5055:5055
    networks:
      - media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=985
      - TZ=Asia/Jerusalem
    volumes:
      - ./data/prowlarr:/config
    ports:
      - 9696:9696
    networks:
      - media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - TZ=Asia/Jerusalem
    ports:
      - 8191:8191
    networks:
      - media

networks:
  media:
    external: true
